plugins {
	id 'fabric-loom' version '1.10.5'
	id 'java'
}

group = 'dev.rodut11'
version = '1.0.0'

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://maven.terraformersmc.com/' } // For ModMenu
	maven { url = 'https://maven.shedaniel.me/' }       // For Cloth Config
	mavenCentral()
}
dependencies {
	minecraft "com.mojang:minecraft:1.21.5"
	mappings "net.fabricmc:yarn:1.21.5+build.1:v2"
	modImplementation "net.fabricmc:fabric-loader:0.16.14"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.124.0+1.21.5"
	modImplementation "com.terraformersmc:modmenu:7.2.2"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.106"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}