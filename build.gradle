plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'java'
}

group = 'dev.rodut11'
version = '1.2.1'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' } // For ModMenu
    maven { url = 'https://maven.shedaniel.me/' }       // For Cloth Config
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:1.21.10"
    mappings "net.fabricmc:yarn:1.21.10+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.3+1.21.10"
    modImplementation "com.terraformersmc:modmenu:7.2.2"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.106"
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
